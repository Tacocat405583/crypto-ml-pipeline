[project]
name = "crypto-ml-pipeline"
version = "0.1.0"
description = "Real-time crypto price prediction pipeline using Kafka, Airflow, MLflow and Spark"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography",
    "boto3",
    "mlflow",
    "pandas",
    "scikit-learn",
    "xgboost",
    "python-dotenv",
    "pyyaml",
    "websockets",
    "confluent-kafka",
    "requests",
    "duckdb>=1.5.5",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# notebooks/ modules import each other as top-level names (import config).
pythonpath = ["notebooks"]
